; OTTO dash companion firmware
; Board: Waveshare ESP32-S3-Touch-LCD-1.46B (412x412 round, SPD2010 QSPI display + touch)
;
; Needs Arduino-ESP32 core 3.1.x (Waveshare supports 3.0.2 - 3.1.1), so this
; uses the community "pioarduino" platform. The SPD2010 display driver is
; bundled in lib/esp_lcd_spd2010 - nothing extra to download.
;
; Build + flash:      pio run -t upload
; Upload voice clips: pio run -t uploadfs      (files in data/clips/)
; Serial console:     pio device monitor

[env:otto]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/53.03.11/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino

board_upload.flash_size = 16MB
board_build.flash_mode = qio
board_build.arduino.memory_type = qio_opi
board_build.partitions = partitions_otto.csv
board_build.filesystem = littlefs

build_flags =
    -DBOARD_HAS_PSRAM
    -DCORE_DEBUG_LEVEL=1
    -DCONFIG_BT_NIMBLE_MAX_CONNECTIONS=3
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1   ; USB-C goes straight to the ESP32-S3 (GPIO19/20), so Serial = native USB

monitor_speed = 115200
; Native USB: the DTR/RTS lines double as the ESP32-S3 reset, and Windows can toggle
; them when a port opens/closes -> the board restarts. Keep them off for the monitor.
monitor_dtr = 0
monitor_rts = 0
upload_speed = 921600

lib_deps =
    lovyan03/LovyanGFX@^1.2.0
    h2zero/NimBLE-Arduino@^1.4.3
    bblanchon/ArduinoJson@^7.0.4
